<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="face" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="35%" stop-color="#fcd34d"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="shine" cx="35%" cy="25%" r="35%">
      <stop offset="0%" stop-color="#fffce0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#fffce0" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Coin edge / depth -->
  <ellipse cx="16" cy="18" rx="13" ry="12" fill="url(#edge)" stroke="#3a1d05" stroke-width="1"/>
  <!-- Edge ridges -->
  <g stroke="#3a1d05" stroke-width="0.5" opacity="0.55">
    <line x1="3" y1="18" x2="3.5" y2="20"/>
    <line x1="6" y1="25" x2="6.5" y2="27"/>
    <line x1="11" y1="29" x2="11.3" y2="31"/>
    <line x1="16" y1="30" x2="16" y2="32"/>
    <line x1="21" y1="29" x2="20.7" y2="31"/>
    <line x1="26" y1="25" x2="25.5" y2="27"/>
    <line x1="29" y1="18" x2="28.5" y2="20"/>
  </g>
  <!-- Coin face -->
  <ellipse cx="16" cy="15" rx="13" ry="12" fill="url(#face)" stroke="#3a1d05" stroke-width="1.2"/>
  <!-- Inner ring -->
  <ellipse cx="16" cy="15" rx="9.5" ry="8.7" fill="none" stroke="#3a1d05" stroke-width="0.7" stroke-dasharray="1.4 1.2" opacity="0.7"/>
  <!-- £ symbol -->
  <text x="16" y="20" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="800" font-size="14" fill="#3a1d05">£</text>
  <!-- Highlight shine -->
  <ellipse cx="11" cy="10" rx="5" ry="2.4" fill="url(#shine)"/>
  <!-- Sparkle -->
  <g fill="#fffce0" opacity="0.95">
    <path d="M27 4 l0.6 1.6 1.6 0.6 -1.6 0.6 -0.6 1.6 -0.6 -1.6 -1.6 -0.6 1.6 -0.6 z"/>
  </g>
</svg>
